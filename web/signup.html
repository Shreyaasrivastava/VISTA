<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create an account · VISTA</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17252d; --muted:#5b6b74; --line:#cfdbe1;
    --teal:#0e5a7a; --teal-dark:#0a4560; --sky:#4fb8dc; --wash:#e3eff5; --err:#b3261e; --ok:#1b6e3c;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Serif",Georgia,serif;color:var(--ink);background:#fff;line-height:1.6}
  .banner{background:var(--wash);text-align:center;padding:12px;font-size:15px}
  header{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line)}
  .logo{width:46px;height:46px;border-radius:8px;background:var(--teal);color:#fff;font:700 28px/46px "Noto Serif",serif;text-align:center}
  .brand{font-weight:700;font-size:22px;color:var(--teal);line-height:1.1}
  .brand small{display:block;font-weight:400;font-size:14px;color:var(--muted)}
  nav{margin-left:auto;display:flex;gap:22px;align-items:center}
  nav a{color:var(--ink);text-decoration:none}
  nav a:hover{text-decoration:underline}
  main{max-width:560px;margin:40px auto;padding:0 20px}
  h1{font-size:34px;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 26px}
  fieldset{border:0;padding:0;margin:0 0 22px}
  legend{font-weight:700;margin-bottom:10px;padding:0}
  .role{display:block;position:relative;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px 12px 44px;margin-bottom:10px;cursor:pointer}
  .role input{position:absolute;left:15px;top:17px;accent-color:var(--teal)}
  .role b{display:block}
  .role span{color:var(--muted);font-size:15px}
  .role:has(input:checked){border-color:var(--teal);background:var(--wash)}
  .role:has(input:focus-visible){outline:3px solid var(--sky);outline-offset:2px}
  label.f{display:block;font-weight:700;margin:16px 0 6px}
  input[type=text],input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  input[type=text]:focus,input[type=password]:focus{outline:3px solid var(--sky);outline-offset:1px;border-color:var(--teal)}
  .hint{font-size:14px;color:var(--muted);margin-top:4px}
  #msg{min-height:24px;margin-top:16px;font-weight:700}
  #msg.err{color:var(--err)} #msg.ok{color:var(--ok)}
  button{font:700 17px "Noto Serif",serif;background:var(--teal);color:#fff;border:0;border-radius:6px;padding:12px 26px;cursor:pointer;margin-top:6px}
  button:hover{background:var(--teal-dark)}
  button:disabled{opacity:.6;cursor:wait}
  .alt{margin-top:22px;color:var(--muted)}
  .alt a{color:var(--teal);font-weight:700}
  @media (max-width:640px){nav a:not(.keep){display:none} h1{font-size:28px}}
</style>
</head>
<body>
<div class="banner">Prototype. Some parts are still in development.</div>
<header>
  <div class="logo">V</div>
  <div class="brand">VISTA<small>Crowd Safety Module</small></div>
  <nav><a href="index.html" class="keep">Home</a><a href="login.html" class="keep">Log in</a></nav>
</header>

<main>
  <h1>Create an account</h1>
  <p class="sub">Pick your role first. It decides which screen you land on after login.</p>

  <form id="f" novalidate>
    <fieldset>
      <legend>I am signing up as</legend>
      <label class="role"><input type="radio" name="role" value="attendee" checked>
        <b>Attendee</b><span>Register for events and get a ticket.</span></label>
      <label class="role"><input type="radio" name="role" value="organiser">
        <b>Organiser</b><span>Manage your venue, cameras and thresholds.</span></label>
      <label class="role"><input type="radio" name="role" value="security">
        <b>Security staff</b><span>See and acknowledge crowd alerts.</span></label>
    </fieldset>

    <label class="f" for="u">Username</label>
    <input type="text" id="u" autocomplete="username">

    <label class="f" for="p">Password</label>
    <input type="password" id="p" autocomplete="new-password">
    <div class="hint">At least 8 characters.</div>

    <label class="f" for="c">Confirm password</label>
    <input type="password" id="c" autocomplete="new-password">

    <div id="msg" role="alert"></div>
    <button type="submit" id="go">Create account</button>
  </form>

  <p class="alt">Already have an account? <a href="login.html">Log in</a></p>
</main>

<script>
  // CHANGE THIS to your real FastAPI signup endpoint
  const API_URL = "http://127.0.0.1:8000/api/signup";

  const f = document.getElementById("f"), msg = document.getElementById("msg"), go = document.getElementById("go");
  const say = (t, c) => { msg.textContent = t; msg.className = c || ""; };

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const role = f.role.value, username = u.value.trim(), password = p.value;

    if (username.length < 3) return say("Username must be at least 3 characters.", "err");
    if (password.length < 8) return say("Password must be at least 8 characters.", "err");
    if (password !== c.value) return say("Passwords do not match.", "err");

    go.disabled = true; say("Creating your account...");
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password, role })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || "Signup failed (" + res.status + ").");
      say("Account created. Redirecting to log in...", "ok");
      setTimeout(() => location.href = "login.html", 900);
    } catch (err) {
      // fetch throws TypeError when the backend is not reachable
      say(err instanceof TypeError
        ? "Cannot reach the server. Start the backend and try again."
        : err.message, "err");
    } finally { go.disabled = false; }
  });
</script>
</body>
</html>
